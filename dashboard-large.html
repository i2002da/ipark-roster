<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPC 통합현장 근무현황 (대형화면)</title>
<style>
/* 매직인포 호환: 외부 폰트 없음, var() 없음, clamp() 없음 */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100vh;overflow:hidden;background:#0a1628;color:#e8f4ff;font-family:Arial,'Malgun Gothic','맑은 고딕',sans-serif}
body{display:flex;flex-direction:column}

/* 헤더 */
.hdr{height:72px;flex-shrink:0;background:#0a2342;border-bottom:3px solid #1a6fc4;display:flex;align-items:center;justify-content:space-between;padding:0 28px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.hdr-left{display:flex;align-items:center;gap:14px}
.hdr-logo{height:44px;object-fit:contain}
.hdr-texts{display:flex;flex-direction:column;justify-content:center}
.hdr-title{font-size:29px;font-weight:700;color:#fff}
.hdr-sub{font-size:16px;color:rgba(255,255,255,.45);margin-top:2px}
.hdr-right{display:flex;align-items:center;gap:18px;flex-shrink:0}
.hdr-clock{text-align:right}
.hdr-date{font-size:26px;font-weight:700;color:#60a5fa;font-family:'Courier New',monospace}
.hdr-time{font-size:17px;color:rgba(255,255,255,.4);margin-top:2px;font-family:'Courier New',monospace}

/* 날짜 선택 */
.date-wrap{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:5px 12px}
.date-lbl{font-size:13px;color:rgba(255,255,255,.4);letter-spacing:.5px}
.date-inp{background:transparent;border:none;outline:none;color:#93c5fd;font-size:18px;font-weight:700;font-family:'Courier New',monospace;cursor:pointer;width:108px}
.date-inp::-webkit-calendar-picker-indicator{filter:invert(.6) brightness(1.5);cursor:pointer}
.btn-today{background:rgba(26,111,196,.3);border:1px solid rgba(100,180,255,.3);color:#93c5fd;font-size:16px;font-weight:700;padding:3px 8px;border-radius:5px;cursor:pointer}

/* 집계 바 */
.stat-bar{flex-shrink:0;height:56px;background:#060f1e;border-bottom:1px solid #1e3550;display:flex;align-items:center;padding:0 28px;gap:0}
.stat-item{display:flex;align-items:center;gap:10px;padding:0 20px;border-right:1px solid #1e3550}
.stat-item:first-child{padding-left:0}
.stat-lbl{font-size:14px;color:rgba(255,255,255,.35);letter-spacing:.8px}
.stat-val{font-size:34px;font-weight:700;font-family:'Courier New',monospace;line-height:1}
.v-tot{color:#60a5fa}.v-work{color:#4ade80}.v-off{color:#f87171}.v-abs{color:#c084fc}
.stat-gauge{flex:1;display:flex;align-items:center;gap:10px;padding:0 20px}
.gauge-track{flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden;display:flex}
.gauge-work{background:#22c55e}.gauge-off{background:#ef4444}.gauge-abs{background:#a855f7}
.gauge-legend{display:flex;gap:12px;flex-shrink:0}
.g-leg{display:flex;align-items:center;gap:4px;font-size:14px;color:rgba(255,255,255,.38)}
.g-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* 현장 그리드 */
.sites{flex:1;display:grid;gap:12px;padding:14px 28px;overflow:hidden;align-items:start;min-height:0}
.site-card{background:#0f1e30;border:1px solid #1e3550;border-radius:12px;padding:14px 18px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.site-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:#1a6fc4}
.site-hdr{display:flex;align-items:center;justify-content:space-between}
.site-name{font-size:23px;font-weight:700;color:#fff}
.site-total{background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);color:#60a5fa;padding:2px 10px;border-radius:20px;font-size:17px;font-weight:700;font-family:'Courier New',monospace}
.site-gauge{display:flex;height:7px;border-radius:4px;overflow:hidden}
.sg-work{background:#22c55e}.sg-off{background:#ef4444}.sg-abs{background:#a855f7}
.stat-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat-num{background:rgba(255,255,255,.04);border-radius:7px;padding:7px 10px;text-align:center}
.stat-num-lbl{font-size:14px;color:rgba(255,255,255,.35);letter-spacing:.5px;margin-bottom:3px}
.stat-num-val{font-size:29px;font-weight:700;font-family:'Courier New',monospace;line-height:1}
.sn-work .stat-num-val{color:#4ade80}.sn-off .stat-num-val{color:#f87171}.sn-abs .stat-num-val{color:#c084fc}
.emp-list{display:flex;flex-wrap:wrap;gap:6px}
.emp-chip{padding:5px 11px;border-radius:7px;font-size:18px;font-weight:600;display:flex;align-items:center;gap:4px}
.chip-work{background:rgba(34,197,94,.12);color:#4ade80;border:1px solid rgba(34,197,94,.2)}
.chip-off {background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.2)}
.chip-abs {background:rgba(168,85,247,.12);color:#c084fc;border:1px solid rgba(168,85,247,.2)}

/* 공지 마퀴 */
.notice-bar{flex-shrink:0;height:64px;background:#0a1e38;border-top:1px solid #1e3550;display:none;align-items:center;overflow:hidden}
.notice-prefix{flex-shrink:0;padding:0 20px;font-size:26px;font-weight:700;color:#60a5fa;background:#060e1e;height:100%;display:flex;align-items:center;border-right:1px solid #1e3550;white-space:nowrap}
.notice-track{flex:1;overflow:hidden;position:relative;height:100%;display:flex;align-items:center}
.notice-text{display:inline-block;white-space:nowrap;font-size:38px;color:rgba(255,255,255,.9);font-weight:600;position:absolute;left:0;top:50%;transform:translateY(-50%)}

/* 하단 */
.footer{flex-shrink:0;height:36px;background:#060e1a;border-top:1px solid #1e3550;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:16px}
.footer-l{color:rgba(255,255,255,.28);display:flex;align-items:center;gap:6px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;display:inline-block}
.footer-r{font-family:'Courier New',monospace;color:rgba(255,255,255,.2);font-size:14px}

/* 로딩 */
.loading{position:fixed;inset:0;background:#0a1628;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:99}
.loading.hide{display:none}
.spin{width:42px;height:42px;border:3px solid #1e3550;border-top-color:#1a6fc4;border-radius:50%;animation:spin .8s linear infinite}
.load-txt{color:rgba(255,255,255,.35);font-size:18px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* 글씨 크기 조절 */
.font-ctrl{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:5px 12px;flex-shrink:0}
.font-ctrl-lbl{font-size:14px;color:rgba(255,255,255,.4);letter-spacing:.5px;white-space:nowrap}
.font-btn{width:28px;height:28px;border-radius:5px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:rgba(255,255,255,.85);font-size:21px;font-weight:700;cursor:pointer;line-height:1;text-align:center}
.font-btn:hover{background:rgba(255,255,255,.22);color:#fff}
.font-scale-lbl{font-size:17px;font-weight:700;color:#60a5fa;min-width:38px;text-align:center;font-family:'Courier New',monospace}
.btn-roster{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:7px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.8);font-size:17px;font-weight:600;text-decoration:none;white-space:nowrap;font-family:Arial,'Malgun Gothic',sans-serif}
.btn-roster:hover{background:rgba(255,255,255,.22);color:#fff}
</style>
</head>

<script>
var DB = "https://workingday-efcd6-default-rtdb.firebaseio.com/hdr_v1";
var WD = ["일","월","화","수","목","금","토"];

// ── JS 마퀴 (CSS animation 대신 — 매직인포 장시간 호환) ──
var _mqTimer=null, _mqPos=0, _mqTxt="";
function startMarquee(txt){
  var span=document.getElementById("noticeText");
  var track=document.querySelector(".notice-track");
  if(!span||!track) return;
  if(txt===_mqTxt && _mqTimer) return;
  _mqTxt=txt;
  span.textContent=txt;
  span.style.animation="none";
  var trackW=track.offsetWidth;
  var textW=span.offsetWidth;
  _mqPos=trackW;
  var speed=Math.max(1, Math.round((trackW+textW) / (Math.max(20,txt.length*0.25)*30)));
  if(_mqTimer){clearInterval(_mqTimer);_mqTimer=null;}
  _mqTimer=setInterval(function(){
    _mqPos-=speed;
    if(_mqPos< -textW){
      trackW=track.offsetWidth;
      textW=span.offsetWidth;
      _mqPos=trackW;
    }
    span.style.transform="translateY(-50%) translateX("+_mqPos+"px)";
  },33);
}
function stopMarquee(){
  if(_mqTimer){clearInterval(_mqTimer);_mqTimer=null;}
  _mqTxt="";
}

// ── 날짜 유틸 ──────────────────────────────────────────
function pad(n){return ("0"+n).slice(-2);}
function todayStr(){
  var d=new Date();
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}
function getRef(){
  var inp=document.getElementById("dateInp");
  return (inp&&inp.value)?inp.value:todayStr();
}
function setToday(){
  var inp=document.getElementById("dateInp");
  if(inp)inp.value=todayStr();
  loadData();
}
function initDateInp(){
  var inp=document.getElementById("dateInp");
  if(inp)inp.value=todayStr();
  inp.addEventListener("change",function(){loadData();});
}

// ── 시계 ──────────────────────────────────────────────
function tick(){
  var d=new Date();
  var dateEl=document.getElementById("hdrDate");
  var timeEl=document.getElementById("hdrTime");
  if(dateEl) dateEl.textContent=(d.getMonth()+1)+"월 "+d.getDate()+"일 ("+WD[d.getDay()]+")";
  if(timeEl) timeEl.textContent=pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
}
setInterval(tick,1000); tick();

// ── toArray ────────────────────────────────────────────
function toArr(v){
  if(!v) return [];
  if(Array.isArray(v)) return v;
  return Object.keys(v).sort(function(a,b){return +a-+b;}).map(function(k){return v[k];});
}

// ── 렌더 ──────────────────────────────────────────────
function render(data){
  var ref=getRef();
  var ym=ref.slice(0,4)+ref.slice(5,7);
  var sites=Array.isArray(data.sites)?data.sites:toArr(data.sites);
  if(!sites||!sites.length) return;

  // 열 수 결정
  var n=sites.length;
  var cols=n<=2?n:n<=4?2:3;
  var grid=document.getElementById("sitesGrid");
  grid.style.gridTemplateColumns="repeat("+cols+",1fr)";

  var totAll=0,workAll=0,offAll=0,absAll=0;
  var cards=[];

  for(var i=0;i<sites.length;i++){
    var site=sites[i]; var sid=site.id;
    var snaps=(data.empSnaps&&data.empSnaps[sid])||{};
    var raw=snaps[ym]?snaps[ym]:((data.employees&&data.employees[sid])||[]);
    var emps=toArr(raw);
    var offs=((data.offDays&&data.offDays[sid])||{});
    var abss=((data.absDays&&data.absDays[sid])||{});

    var tot=0,work=0,off=0,abs=0,empChips=[];
    for(var j=0;j<emps.length;j++){
      var emp=emps[j];
      var jd=emp.joinDate||"2026-04-01";
      if(ref<jd) continue;
      tot++;
      var eid=String(+emp.id);
      var hasOff=offs[eid]&&offs[eid][ref];
      var hasAbs=abss[eid]&&abss[eid][ref];
      if(hasOff){off++;empChips.push({n:emp.name,s:"off",a:""});}
      else if(hasAbs){
        abs++;
        var al=hasAbs==="교육"?"교":hasAbs==="출장"?"출":hasAbs==="병가"?"병":"기";
        empChips.push({n:emp.name,s:"abs",a:al,t:hasAbs});
      }else{work++;empChips.push({n:emp.name,s:"work",a:""});}
    }
    totAll+=tot;workAll+=work;offAll+=off;absAll+=abs;

    var chips=empChips.map(function(e){
      var cls=e.s==="work"?"chip-work":e.s==="off"?"chip-off":"chip-abs";
      var ic=e.s==="work"?"&#9679;":e.s==="off"?"&#xD734;":(e.a||"&#xBBF8;");
      return "<span class='emp-chip "+cls+"' title='"+(e.t||"")+"'><span>"+ic+"</span>"+e.n+"</span>";
    }).join("");

    cards.push(
      "<div class='site-card'>" +
        "<div class='site-hdr'>" +
          "<div class='site-name'>"+site.dispLabel+"</div>" +
          "<div class='site-total'>"+tot+"명</div>" +
        "</div>" +
        "<div class='site-gauge'>" +
          "<div class='sg-work' style='flex:"+work+"'></div>" +
          "<div class='sg-off'  style='flex:"+off +"'></div>" +
          "<div class='sg-abs'  style='flex:"+abs +"'></div>" +
        "</div>" +
        "<div class='stat-nums'>" +
          "<div class='stat-num sn-work'><div class='stat-num-lbl'>근&nbsp;무</div><div class='stat-num-val'>"+work+"</div></div>" +
          "<div class='stat-num sn-off'> <div class='stat-num-lbl'>휴&nbsp;무</div><div class='stat-num-val'>"+off +"</div></div>" +
          "<div class='stat-num sn-abs'> <div class='stat-num-lbl'>미근무</div><div class='stat-num-val'>"+abs +"</div></div>" +
        "</div>" +
        "<div class='emp-list'>"+chips+"</div>" +
      "</div>"
    );
  }

  grid.innerHTML=cards.join("");
  document.getElementById("vTot").textContent=totAll;
  document.getElementById("vWork").textContent=workAll;
  document.getElementById("vOff").textContent=offAll;
  document.getElementById("vAbs").textContent=absAll;
  document.getElementById("gWork").style.flex=workAll||0;
  document.getElementById("gOff").style.flex=offAll||0;
  document.getElementById("gAbs").style.flex=absAll||0;

  // 공지사항 (dashNotice) — 기간 방식 + 기존 ymKey 방식 하위호환
  var dn=data.dashNotice||{};
  var today2=ref; // 기준일
  var noticeTxt="";
  // 새 형식: dashNotice.items = [{text,startDate,endDate}, ...]
  if(dn.items && Array.isArray(dn.items)){
    var activeItems=[];
    for(var ni=0;ni<dn.items.length;ni++){
      var item=dn.items[ni];
      if(item.text && item.startDate && item.endDate){
        if(today2>=item.startDate && today2<=item.endDate){
          activeItems.push(item.text.trim());
        }
      }
    }
    noticeTxt=activeItems.join("          ");
  } else {
    // 구형식: dashNotice[ymKey] = 문자열
    noticeTxt=typeof dn==="object"?(dn[ym]||""):dn;
  }
  var bar=document.getElementById("noticeBar");
  if(noticeTxt&&noticeTxt.trim()){
    bar.style.display="flex";
    startMarquee(noticeTxt.trim());
  }else{bar.style.display="none";stopMarquee();}

  // 갱신 시각
  var now=new Date();
  document.getElementById("ftTime").textContent=
    pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds())+" 갱신";
  document.getElementById("syncLbl").textContent="실시간 동기화 중";

  // 로딩 제거
  var ld=document.getElementById("ld");
  if(ld) ld.className="loading hide";
}

// ── REST API 데이터 로드 ───────────────────────────────
function loadData(){
  var url=DB+".json";
  var xhr=new XMLHttpRequest();
  xhr.open("GET",url,true);
  xhr.timeout=10000;
  xhr.onreadystatechange=function(){
    if(xhr.readyState===4){
      if(xhr.status===200){
        try{
          var data=JSON.parse(xhr.responseText);
          render(data);
        }catch(e){
          document.getElementById("ldtxt").textContent="데이터 파싱 오류: "+e.message;
        }
      }else{
        document.getElementById("syncLbl").textContent="로드 실패 ("+xhr.status+") 재시도 중...";
      }
    }
  };
  xhr.onerror=function(){document.getElementById("syncLbl").textContent="네트워크 오류. 재시도 중...";}
  xhr.send();
}

// ── 글씨 크기 조절 ─────────────────────────────────────
// BASE_SIZES: 원본 px 값 배열 (CSS 내 font-size:Npx 값들)
var _fontScale = 130;  // % (130% 대형화면 버전)
var _fontStep  = 5;    // 5% 단위
var _fontMin   = 70;
var _fontMax   = 200;

// CSS 텍스트에서 font-size 값을 파싱 → 동적으로 <style> 교체
var _origStyle = null;

function initFontCtrl(){
  // 원본 스타일 저장 (최초 1회)
  var styleEl = document.querySelector('style');
  if(styleEl && !_origStyle) _origStyle = styleEl.textContent;
  // localStorage에서 복원
  try{
    var saved = localStorage.getItem('dash_font_scale_large');
    if(saved) _fontScale = +saved;
  }catch(e){}
  applyFontScale();
}

function adjFont(dir){
  if(dir===0){ _fontScale=100; }
  else{ _fontScale = Math.min(_fontMax, Math.max(_fontMin, _fontScale + dir*_fontStep)); }
  applyFontScale();
  try{ localStorage.setItem('dash_font_scale_large', _fontScale); }catch(e){}
}

function applyFontScale(){
  var lbl = document.getElementById('fontScaleLbl');
  if(lbl) lbl.textContent = _fontScale+'%';
  if(!_origStyle) return;
  var ratio = _fontScale / 100;
  var newCss = _origStyle.replace(/font-size:([\d.]+)px/g, function(m,v){
    return 'font-size:' + Math.round(+v * ratio) + 'px';
  });
  var styleEl = document.querySelector('style');
  if(styleEl) styleEl.textContent = newCss;
}

// 초기 로드 + 30초 자동 갱신
initDateInp();
initFontCtrl();
loadData();
setInterval(loadData,30000);

// 자정 자동 새로고침
(function(){
  var now=new Date();
  var midnight=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
  setTimeout(function(){location.reload();},midnight-now+5000);
})();
</script>
