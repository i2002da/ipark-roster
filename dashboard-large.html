<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=1920">
<title>IPC 통합현장 근무현황 (대형)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100vh;overflow:hidden;background:#f0f4f8;color:#0a2342;font-family:Arial,'Malgun Gothic','맑은 고딕',sans-serif}
body{display:flex;flex-direction:column}
.hdr{height:72px;flex-shrink:0;background:#0a2342;border-bottom:3px solid #1a6fc4;display:flex;align-items:center;justify-content:space-between;padding:0 28px;box-shadow:0 3px 16px rgba(0,0,0,.3)}
.hdr-left{display:flex;align-items:center;gap:14px}
.hdr-logo{height:40px;object-fit:contain}
.hdr-texts{display:flex;flex-direction:column;justify-content:center}
.hdr-title{font-size:20px;font-weight:700;color:#fff}
.hdr-sub{font-size:11px;color:rgba(255,255,255,.5);margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:16px;flex-shrink:0}
.hdr-clock{text-align:right}
.hdr-date{font-size:17px;font-weight:700;color:#60a5fa;font-family:'Courier New',monospace}
.hdr-time{font-size:11px;color:rgba(255,255,255,.4);margin-top:1px;font-family:'Courier New',monospace}
.date-wrap{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:7px;padding:5px 11px}
.date-lbl{font-size:9px;color:rgba(255,255,255,.45);letter-spacing:.5px}
.date-inp{background:transparent;border:none;outline:none;color:#93c5fd;font-size:13px;font-weight:700;font-family:'Courier New',monospace;cursor:pointer;width:108px}
.date-inp::-webkit-calendar-picker-indicator{filter:invert(.6) brightness(1.5);cursor:pointer}
.btn-today{background:rgba(26,111,196,.3);border:1px solid rgba(100,180,255,.3);color:#93c5fd;font-size:11px;font-weight:700;padding:3px 8px;border-radius:5px;cursor:pointer}
.stat-bar{flex-shrink:0;height:52px;background:#e8eef5;border-bottom:1px solid #c2d4e8;display:flex;align-items:center;padding:0 24px;gap:0}
.stat-item{display:flex;align-items:center;gap:8px;padding:0 18px;border-right:1px solid #c2d4e8}
.stat-item:first-child{padding-left:0}
.stat-lbl{font-size:10px;color:#7a9bbf;letter-spacing:.8px;font-weight:600}
.stat-val{font-size:26px;font-weight:700;font-family:'Courier New',monospace;line-height:1}
.v-tot{color:#1a6fc4}.v-work{color:#1a7a40}.v-off{color:#c0392b}.v-abs{color:#6b21a8}
.stat-gauge{flex:1;display:flex;align-items:center;gap:10px;padding:0 18px}
.gauge-track{flex:1;height:10px;border-radius:5px;background:#dde8f2;overflow:hidden;display:flex}
.gauge-work{background:#22c55e}.gauge-off{background:#ef4444}.gauge-abs{background:#a855f7}
.gauge-legend{display:flex;gap:12px;flex-shrink:0}
.g-leg{display:flex;align-items:center;gap:4px;font-size:11px;color:#3d6b9a;font-weight:600}
.g-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sites{flex:1;display:grid;gap:10px;padding:10px 24px;overflow:hidden;min-height:0}
.site-card{background:#ffffff;border:1px solid #c2d4e8;border-radius:11px;padding:12px 16px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.site-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:#1a6fc4}
.site-hdr{display:flex;align-items:center;justify-content:space-between}
.site-name{font-size:20px;font-weight:900;color:#0a2342;letter-spacing:-.3px}
.site-total{background:#ddeeff;border:1px solid #b8d4f0;color:#1a6fc4;padding:2px 12px;border-radius:20px;font-size:14px;font-weight:700;font-family:'Courier New',monospace}
.site-gauge{display:flex;height:7px;border-radius:4px;overflow:hidden;background:#e8eef5}
.sg-work{background:#22c55e}.sg-off{background:#ef4444}.sg-abs{background:#a855f7}
.stat-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat-num{background:#f0f4f8;border-radius:7px;padding:6px 8px;text-align:center}
.stat-num-lbl{font-size:10px;color:#7a9bbf;letter-spacing:.5px;margin-bottom:2px;font-weight:600}
.stat-num-val{font-size:22px;font-weight:700;font-family:'Courier New',monospace;line-height:1}
.sn-work .stat-num-val{color:#1a7a40}.sn-off .stat-num-val{color:#c0392b}.sn-abs .stat-num-val{color:#6b21a8}
.emp-list{display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;overflow:hidden;flex:1}
.emp-chip{padding:4px 10px;border-radius:6px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:4px}
.chip-work{background:#d4edda;color:#1a5c30;border:1px solid #a3cfab}
.chip-off{background:#ffd5d5;color:#8b1a1a;border:1px solid #f0a0a0}
.chip-abs{background:#e8d8ff;color:#5b21b6;border:1px solid #c4a0e8}
.notice-bar{flex-shrink:0;height:56px;background:#ddeeff;border-top:2px solid #b8d4f0;display:none;align-items:center;overflow:hidden}
.notice-prefix{flex-shrink:0;padding:0 18px;font-size:16px;font-weight:700;color:#0a2342;background:#b8d4f0;height:100%;display:flex;align-items:center;border-right:1px solid #9bbedd;white-space:nowrap}
.notice-track{flex:1;overflow:hidden;position:relative;height:100%;display:flex;align-items:center}
.notice-text{display:inline-block;white-space:nowrap;font-size:22px;color:#0a2342;font-weight:700;position:absolute;padding-left:100%}
.footer{flex-shrink:0;height:30px;background:#dde8f2;border-top:1px solid #c2d4e8;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:10px}
.footer-l{color:#7a9bbf;display:flex;align-items:center;gap:6px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;display:inline-block}
.footer-r{font-family:'Courier New',monospace;color:#aab8cc;font-size:10px}
.loading{position:fixed;inset:0;background:#f0f4f8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:99}
.loading.hide{display:none}
.spin{width:42px;height:42px;border:3px solid #c2d4e8;border-top-color:#1a6fc4;border-radius:50%;animation:spin .8s linear infinite}
.load-txt{color:#7a9bbf;font-size:13px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
</style>
</head>
<body>

<script>
var DB = "https://workingday-efcd6-default-rtdb.firebaseio.com/hdr_v1";
var WD = ["일","월","화","수","목","금","토"];

// ── 날짜 유틸 ──────────────────────────────────────────
function pad(n){return ("0"+n).slice(-2);}
function todayStr(){
  var d=new Date();
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}
function getRef(){
  var inp=document.getElementById("dateInp");
  return (inp&&inp.value)?inp.value:todayStr();
}
function setToday(){
  var inp=document.getElementById("dateInp");
  if(inp)inp.value=todayStr();
  loadData();
}
function initDateInp(){
  var inp=document.getElementById("dateInp");
  if(inp)inp.value=todayStr();
  inp.addEventListener("change",function(){loadData();});
}

// ── 시계 ──────────────────────────────────────────────
function tick(){
  var d=new Date();
  var dateEl=document.getElementById("hdrDate");
  var timeEl=document.getElementById("hdrTime");
  if(dateEl) dateEl.textContent=(d.getMonth()+1)+"월 "+d.getDate()+"일 ("+WD[d.getDay()]+")";
  if(timeEl) timeEl.textContent=pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
}
setInterval(tick,1000); tick();

// ── toArray ────────────────────────────────────────────
function toArr(v){
  if(!v) return [];
  if(Array.isArray(v)) return v;
  return Object.keys(v).sort(function(a,b){return +a-+b;}).map(function(k){return v[k];});
}

// ── 렌더 ──────────────────────────────────────────────
function render(data){
  var ref=getRef();
  var ym=ref.slice(0,4)+ref.slice(5,7);
  var sites=Array.isArray(data.sites)?data.sites:toArr(data.sites);
  if(!sites||!sites.length) return;

  // 열 수 결정
  var n=sites.length;
  var cols=n<=2?n:n<=4?2:3;
  var rows=Math.ceil(n/cols);
  var grid=document.getElementById("sitesGrid");
  grid.style.gridTemplateColumns="repeat("+cols+",1fr)";
  grid.style.gridTemplateRows="repeat("+rows+",1fr)";

  var totAll=0,workAll=0,offAll=0,absAll=0;
  var cards=[];

  for(var i=0;i<sites.length;i++){
    var site=sites[i]; var sid=site.id;
    var snaps=(data.empSnaps&&data.empSnaps[sid])||{};
    var raw=snaps[ym]?snaps[ym]:((data.employees&&data.employees[sid])||[]);
    var emps=toArr(raw);
    var offs=((data.offDays&&data.offDays[sid])||{});
    var abss=((data.absDays&&data.absDays[sid])||{});

    var tot=0,work=0,off=0,abs=0,empChips=[];
    for(var j=0;j<emps.length;j++){
      var emp=emps[j];
      var jd=emp.joinDate||"2026-04-01";
      if(ref<jd) continue;
      tot++;
      var eid=String(+emp.id);
      var hasOff=offs[eid]&&offs[eid][ref];
      var hasAbs=abss[eid]&&abss[eid][ref];
      if(hasOff){off++;empChips.push({n:emp.name,s:"off",a:""});}
      else if(hasAbs){
        abs++;
        var al=hasAbs==="교육"?"교":hasAbs==="출장"?"출":hasAbs==="병가"?"병":"기";
        empChips.push({n:emp.name,s:"abs",a:al,t:hasAbs});
      }else{work++;empChips.push({n:emp.name,s:"work",a:""});}
    }
    totAll+=tot;workAll+=work;offAll+=off;absAll+=abs;

    var chips=empChips.map(function(e){
      var cls=e.s==="work"?"chip-work":e.s==="off"?"chip-off":"chip-abs";
      var ic=e.s==="work"?"&#9679;":e.s==="off"?"&#xD734;":(e.a||"&#xBBF8;");
      return "<span class='emp-chip "+cls+"' title='"+(e.t||"")+"'><span>"+ic+"</span>"+e.n+"</span>";
    }).join("");

    cards.push(
      "<div class='site-card'>" +
        "<div class='site-hdr'>" +
          "<div class='site-name'>"+site.dispLabel+"</div>" +
          "<div class='site-total'>"+tot+"명</div>" +
        "</div>" +
        "<div class='site-gauge'>" +
          "<div class='sg-work' style='flex:"+work+"'></div>" +
          "<div class='sg-off'  style='flex:"+off +"'></div>" +
          "<div class='sg-abs'  style='flex:"+abs +"'></div>" +
        "</div>" +
        "<div class='stat-nums'>" +
          "<div class='stat-num sn-work'><div class='stat-num-lbl'>근&nbsp;무</div><div class='stat-num-val'>"+work+"</div></div>" +
          "<div class='stat-num sn-off'> <div class='stat-num-lbl'>휴&nbsp;무</div><div class='stat-num-val'>"+off +"</div></div>" +
          "<div class='stat-num sn-abs'> <div class='stat-num-lbl'>미근무</div><div class='stat-num-val'>"+abs +"</div></div>" +
        "</div>" +
        "<div class='emp-list'>"+chips+"</div>" +
      "</div>"
    );
  }

  grid.innerHTML=cards.join("");
  document.getElementById("vTot").textContent=totAll;
  document.getElementById("vWork").textContent=workAll;
  document.getElementById("vOff").textContent=offAll;
  document.getElementById("vAbs").textContent=absAll;
  document.getElementById("gWork").style.flex=workAll||0;
  document.getElementById("gOff").style.flex=offAll||0;
  document.getElementById("gAbs").style.flex=absAll||0;

  // 공지사항 (dashNotice)
  var dn=data.dashNotice||{};
  var noticeYm=ym;
  var noticeTxt=typeof dn==="object"?(dn[noticeYm]||""):dn;
  var bar=document.getElementById("noticeBar");
  var span=document.getElementById("noticeText");
  if(noticeTxt&&noticeTxt.trim()){
    span.textContent=noticeTxt.trim();
    bar.style.display="flex";
    var dur=Math.max(20,noticeTxt.length*0.25);
    span.style.animation="none";
    span.style.animation="marquee "+dur+"s linear infinite";
  }else{bar.style.display="none";}

  // 갱신 시각
  var now=new Date();
  document.getElementById("ftTime").textContent=
    pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds())+" 갱신";
  document.getElementById("syncLbl").textContent="실시간 동기화 중";

  // 로딩 제거
  var ld=document.getElementById("ld");
  if(ld) ld.className="loading hide";
}

// ── REST API 데이터 로드 ───────────────────────────────
function loadData(){
  var url=DB+".json";
  var xhr=new XMLHttpRequest();
  xhr.open("GET",url,true);
  xhr.timeout=10000;
  xhr.onreadystatechange=function(){
    if(xhr.readyState===4){
      if(xhr.status===200){
        try{
          var data=JSON.parse(xhr.responseText);
          render(data);
        }catch(e){
          document.getElementById("ldtxt").textContent="데이터 파싱 오류: "+e.message;
        }
      }else{
        document.getElementById("syncLbl").textContent="로드 실패 ("+xhr.status+") 재시도 중...";
      }
    }
  };
  xhr.onerror=function(){document.getElementById("syncLbl").textContent="네트워크 오류. 재시도 중...";}
  xhr.send();
}

// 초기 로드 + 30초 자동 갱신
initDateInp();
loadData();
setInterval(loadData,30000);

// 자정 자동 새로고침
(function(){
  var now=new Date();
  var midnight=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
  setTimeout(function(){location.reload();},midnight-now+5000);
})();
</script>
