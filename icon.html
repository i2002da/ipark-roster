<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>IPC 대시보드 아이콘 생성기</title>
<style>
body{font-family:'Noto Sans KR',sans-serif;background:#f0f4f8;display:flex;flex-direction:column;align-items:center;padding:40px 20px;gap:32px;min-height:100vh}
h1{font-size:20px;font-weight:700;color:#0a2342;margin:0}
.desc{font-size:13px;color:#7a9bbf;margin-top:4px;text-align:center}
.icons{display:flex;flex-wrap:wrap;gap:32px;justify-content:center}
.icon-box{background:#fff;border:1px solid #c2d4e8;border-radius:16px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:16px;box-shadow:0 4px 16px rgba(10,35,66,.08)}
.icon-box h2{font-size:13px;color:#3d6b9a;font-weight:600;margin:0}
canvas{border-radius:16px;box-shadow:0 4px 20px rgba(10,35,66,.2)}
.btn{background:linear-gradient(135deg,#0a2342,#1a6fc4);color:#fff;border:none;padding:10px 22px;border-radius:8px;font-size:13px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{opacity:.88}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.note{font-size:11px;color:#7a9bbf;text-align:center;max-width:500px;line-height:1.7}
</style>
</head>
<body>

<div style="text-align:center">
  <h1>📺 IPC 대시보드 아이콘</h1>
  <div class="desc">삼성 VXT CMS 및 바로가기용 아이콘 파일 다운로드</div>
</div>

<div class="icons">
  <div class="icon-box">
    <h2>512 × 512 px (앱 아이콘)</h2>
    <canvas id="c512" width="512" height="512"></canvas>
    <div class="btns">
      <button class="btn" onclick="download('c512','IPC_dashboard_512.png')">⬇ PNG 다운로드</button>
    </div>
  </div>
  <div class="icon-box">
    <h2>192 × 192 px (홈 화면)</h2>
    <canvas id="c192" width="192" height="192"></canvas>
    <div class="btns">
      <button class="btn" onclick="download('c192','IPC_dashboard_192.png')">⬇ PNG 다운로드</button>
    </div>
  </div>
  <div class="icon-box">
    <h2>64 × 64 px (파비콘)</h2>
    <canvas id="c64" width="64" height="64"></canvas>
    <div class="btns">
      <button class="btn" onclick="download('c64','IPC_dashboard_64.png')">⬇ PNG 다운로드</button>
    </div>
  </div>
</div>

<p class="note">
  VXT CMS 등록 시 512px 아이콘을 사용하세요.<br>
  홈 화면 바로가기는 192px, 브라우저 탭 파비콘은 64px를 사용합니다.
</p>

<script>
function drawIcon(canvas, size){
  const ctx = canvas.getContext('2d');
  const s = size;
  const r = s * 0.18; // 모서리 radius

  // ── 배경 ──────────────────────────────────
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(s-r, 0);
  ctx.quadraticCurveTo(s, 0, s, r);
  ctx.lineTo(s, s-r);
  ctx.quadraticCurveTo(s, s, s-r, s);
  ctx.lineTo(r, s);
  ctx.quadraticCurveTo(0, s, 0, s-r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fillStyle = '#0a2342';
  ctx.fill();

  // ── 상단 강조 선 ──────────────────────────
  ctx.fillStyle = '#1a6fc4';
  ctx.fillRect(0, 0, s, s*0.025);

  // ── IPC 텍스트 ────────────────────────────
  ctx.fillStyle = '#60a5fa';
  ctx.font = `900 ${s*0.14}px 'Roboto Mono',monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.letterSpacing = s*0.02+'px';
  ctx.fillText('IPC', s/2, s*0.2);

  // ── 구분선 ────────────────────────────────
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.fillRect(s*0.06, s*0.32, s*0.88, 1);

  // ── 현장 카드 ─────────────────────────────
  const cards = [
    { label:'5단지', val:'12', color:'#1a6fc4' },
    { label:'6단지', val:'9',  color:'#3d9bdc' },
    { label:'부지',  val:'7',  color:'#3d9bdc' },
  ];
  const cw = s * 0.27;
  const ch = s * 0.28;
  const cy = s * 0.35;
  const gap = (s - s*0.06*2 - cw*3) / 2;
  const startX = s * 0.06;

  cards.forEach((card, i) => {
    const cx2 = startX + i*(cw+gap);
    // 카드 배경
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    roundRect(ctx, cx2, cy, cw, ch, s*0.04);
    ctx.fill();
    // 카드 상단 색상 바
    ctx.fillStyle = card.color;
    roundRectTop(ctx, cx2, cy, cw, s*0.02, s*0.02);
    ctx.fill();
    // 현장명
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.font = `600 ${s*0.05}px 'Noto Sans KR',sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(card.label, cx2+cw/2, cy+ch*0.3);
    // 수치
    ctx.fillStyle = '#4ade80';
    ctx.font = `900 ${s*0.12}px 'Roboto Mono',monospace`;
    ctx.fillText(card.val, cx2+cw/2, cy+ch*0.62);
    // 단위
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = `400 ${s*0.04}px 'Noto Sans KR',sans-serif`;
    ctx.fillText('근무', cx2+cw/2, cy+ch*0.85);
  });

  // ── 하단 게이지 바 ────────────────────────
  const barY = s * 0.69;
  const barH = s * 0.06;
  const barX = s * 0.06;
  const barW = s * 0.88;
  // 배경
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  roundRect(ctx, barX, barY, barW, barH, barH/2);
  ctx.fill();
  // 근무 (녹색)
  ctx.fillStyle = '#22c55e';
  roundRectLeft(ctx, barX+s*0.012, barY+s*0.015, barW*0.57, barH-s*0.03, (barH-s*0.03)/2);
  ctx.fill();
  // 휴무 (빨강)
  ctx.fillStyle = '#ef4444';
  ctx.beginPath();
  ctx.rect(barX+s*0.012+barW*0.57+s*0.01, barY+s*0.015, barW*0.2, barH-s*0.03);
  ctx.fill();
  // 미근무 (보라)
  ctx.fillStyle = '#a855f7';
  roundRectRight(ctx, barX+s*0.012+barW*0.57+s*0.01+barW*0.2+s*0.005, barY+s*0.015, barW*0.14, barH-s*0.03, (barH-s*0.03)/2);
  ctx.fill();

  // ── 하단 레이블 ───────────────────────────
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.font = `600 ${s*0.055}px 'Noto Sans KR',sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('근무현황 대시보드', s/2, s*0.9);
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function roundRectTop(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h);
  ctx.lineTo(x,y+h);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function roundRectLeft(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w,y);
  ctx.lineTo(x+w,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function roundRectRight(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x,y+h);
  ctx.closePath();
}

function download(id, filename){
  const canvas = document.getElementById(id);
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = filename;
  a.click();
}

// 렌더링
['512','192','64'].forEach(size=>{
  const canvas = document.getElementById('c'+size);
  drawIcon(canvas, +size);
});
</script>
</body>
</html>
