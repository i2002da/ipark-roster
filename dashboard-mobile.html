<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>IPC 근무현황 (모바일)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{background:#0a1628;color:#e8f4ff;font-family:Arial,'Malgun Gothic','맑은 고딕',sans-serif;min-height:100vh;display:flex;flex-direction:column}

/* ── 헤더 ── */
.hdr{background:#0a2342;border-bottom:3px solid #1a6fc4;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 20px rgba(0,0,0,.5);flex-shrink:0}
.hdr-left{display:flex;align-items:center;gap:10px}
.hdr-logo{height:32px;object-fit:contain}
.hdr-title{font-size:15px;font-weight:700;color:#fff;line-height:1.2}
.hdr-sub{font-size:10px;color:rgba(255,255,255,.4);margin-top:2px}
.hdr-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.hdr-clock{text-align:right}
.hdr-date{font-size:13px;font-weight:700;color:#60a5fa;font-family:'Courier New',monospace}
.hdr-time{font-size:11px;color:rgba(255,255,255,.4);font-family:'Courier New',monospace}

/* ── 툴바 ── */
.toolbar{background:#060f1e;border-bottom:1px solid #1e3550;padding:8px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.date-wrap{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:7px;padding:4px 10px;flex:1;min-width:170px}
.date-lbl{font-size:9px;color:rgba(255,255,255,.4);letter-spacing:.4px;white-space:nowrap}
.date-inp{background:transparent;border:none;outline:none;color:#93c5fd;font-size:13px;font-weight:700;font-family:'Courier New',monospace;cursor:pointer;width:100px}
.date-inp::-webkit-calendar-picker-indicator{filter:invert(.6) brightness(1.5);cursor:pointer}
.btn-today{background:rgba(26,111,196,.3);border:1px solid rgba(100,180,255,.3);color:#93c5fd;font-size:11px;font-weight:700;padding:4px 8px;border-radius:5px;cursor:pointer;white-space:nowrap}
.btn-link{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.8);font-size:11px;font-weight:600;text-decoration:none;white-space:nowrap}
.btn-link.yellow{background:rgba(250,204,21,.12);border-color:rgba(250,204,21,.3);color:#fde047}
.font-ctrl{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:7px;padding:4px 8px}
.font-lbl{font-size:9px;color:rgba(255,255,255,.4);white-space:nowrap}
.font-btn{width:26px;height:26px;border-radius:4px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:rgba(255,255,255,.85);font-size:15px;font-weight:700;cursor:pointer;line-height:1;text-align:center;padding:0}
.font-scale-lbl{font-size:11px;font-weight:700;color:#60a5fa;min-width:34px;text-align:center;font-family:'Courier New',monospace}

/* ── 집계 바 ── */
.stat-bar{background:#060f1e;border-bottom:1px solid #1e3550;padding:8px 14px;display:flex;align-items:center;gap:0;flex-shrink:0}
.stat-item{display:flex;flex-direction:column;align-items:center;padding:0 12px;border-right:1px solid #1e3550;flex:1}
.stat-item:first-child{padding-left:0}
.stat-lbl{font-size:9px;color:rgba(255,255,255,.35);letter-spacing:.6px;margin-bottom:2px}
.stat-val{font-size:22px;font-weight:700;font-family:'Courier New',monospace;line-height:1}
.v-tot{color:#60a5fa}.v-work{color:#4ade80}.v-off{color:#f87171}.v-abs{color:#c084fc}
.stat-gauge-row{display:flex;align-items:center;gap:8px;padding-left:12px;flex:2}
.gauge-track{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden;display:flex}
.gauge-work{background:#22c55e}.gauge-off{background:#ef4444}.gauge-abs{background:#a855f7}
.gauge-legend{display:flex;flex-direction:column;gap:3px;flex-shrink:0}
.g-leg{display:flex;align-items:center;gap:3px;font-size:9px;color:rgba(255,255,255,.35)}
.g-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* ── 현장 카드 그리드 ── */
.sites{flex:1;display:flex;flex-direction:column;gap:8px;padding:10px 14px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.site-card{background:#0f1e30;border:1px solid #1e3550;border-radius:10px;padding:12px 14px;position:relative;overflow:hidden}
.site-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:#1a6fc4}
.site-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.site-name{font-size:15px;font-weight:700;color:#fff}
.site-total{background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);color:#60a5fa;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:700;font-family:'Courier New',monospace}
.site-gauge{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-bottom:8px}
.sg-work{background:#22c55e}.sg-off{background:#ef4444}.sg-abs{background:#a855f7}
.stat-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.stat-num{background:rgba(255,255,255,.04);border-radius:6px;padding:6px 8px;text-align:center}
.stat-num-lbl{font-size:9px;color:rgba(255,255,255,.35);letter-spacing:.4px;margin-bottom:2px}
.stat-num-val{font-size:18px;font-weight:700;font-family:'Courier New',monospace;line-height:1}
.sn-work .stat-num-val{color:#4ade80}.sn-off .stat-num-val{color:#f87171}.sn-abs .stat-num-val{color:#c084fc}
.emp-list{display:flex;flex-wrap:wrap;gap:5px}
.emp-chip{padding:4px 9px;border-radius:6px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:3px}
.chip-work{background:rgba(34,197,94,.12);color:#4ade80;border:1px solid rgba(34,197,94,.2)}
.chip-off {background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.2)}
.chip-abs {background:rgba(168,85,247,.12);color:#c084fc;border:1px solid rgba(168,85,247,.2)}

/* ── 공지 마퀴 ── */
.notice-bar{flex-shrink:0;height:44px;background:#0a1e38;border-top:1px solid #1e3550;display:none;align-items:center;overflow:hidden}
.notice-prefix{flex-shrink:0;padding:0 12px;font-size:14px;font-weight:700;color:#60a5fa;background:#060e1e;height:100%;display:flex;align-items:center;border-right:1px solid #1e3550;white-space:nowrap}
.notice-track{flex:1;overflow:hidden;position:relative;height:100%;display:flex;align-items:center}
.notice-text{display:inline-block;white-space:nowrap;font-size:15px;color:rgba(255,255,255,.9);font-weight:600;position:absolute;padding-left:100%}

/* ── 하단 ── */
.footer{flex-shrink:0;height:32px;background:#060e1a;border-top:1px solid #1e3550;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:10px}
.footer-l{color:rgba(255,255,255,.28);display:flex;align-items:center;gap:5px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;display:inline-block}
.footer-r{font-family:'Courier New',monospace;color:rgba(255,255,255,.2);font-size:9px}

/* ── 로딩 ── */
.loading{position:fixed;inset:0;background:#0a1628;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:99}
.loading.hide{display:none}
.spin{width:36px;height:36px;border:3px solid #1e3550;border-top-color:#1a6fc4;border-radius:50%;animation:spin .8s linear infinite}
.load-txt{color:rgba(255,255,255,.35);font-size:13px}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}

/* ── 태블릿(768px+): 2열 그리드 ── */
@media(min-width:768px){
  .sites{display:grid;grid-template-columns:repeat(2,1fr)}
  .hdr-title{font-size:17px}
  .hdr-logo{height:36px}
  .stat-val{font-size:26px}
  .stat-num-val{font-size:20px}
}
</style>
</head>

<script>
var DB = "https://workingday-efcd6-default-rtdb.firebaseio.com/hdr_v1";
var WD = ["일","월","화","수","목","금","토"];

function pad(n){return ("0"+n).slice(-2);}
function todayStr(){
  var d=new Date();
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}
function getRef(){
  var inp=document.getElementById("dateInp");
  return (inp&&inp.value)?inp.value:todayStr();
}
function setToday(){
  var inp=document.getElementById("dateInp");
  if(inp)inp.value=todayStr();
  loadData();
}
function initDateInp(){
  var inp=document.getElementById("dateInp");
  if(inp)inp.value=todayStr();
  inp.addEventListener("change",function(){loadData();});
}

function tick(){
  var d=new Date();
  var dateEl=document.getElementById("hdrDate");
  var timeEl=document.getElementById("hdrTime");
  if(dateEl) dateEl.textContent=(d.getMonth()+1)+"월 "+d.getDate()+"일 ("+WD[d.getDay()]+")";
  if(timeEl) timeEl.textContent=pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
}
setInterval(tick,1000); tick();

function toArr(v){
  if(!v) return [];
  if(Array.isArray(v)) return v;
  return Object.keys(v).sort(function(a,b){return +a-+b;}).map(function(k){return v[k];});
}

function render(data){
  var ref=getRef();
  var ym=ref.slice(0,4)+ref.slice(5,7);
  var sites=Array.isArray(data.sites)?data.sites:toArr(data.sites);
  if(!sites||!sites.length) return;

  var grid=document.getElementById("sitesGrid");
  var totAll=0,workAll=0,offAll=0,absAll=0;
  var cards=[];

  for(var i=0;i<sites.length;i++){
    var site=sites[i]; var sid=site.id;
    var snaps=(data.empSnaps&&data.empSnaps[sid])||{};
    var raw=snaps[ym]?snaps[ym]:((data.employees&&data.employees[sid])||[]);
    var emps=toArr(raw);
    var offs=((data.offDays&&data.offDays[sid])||{});
    var abss=((data.absDays&&data.absDays[sid])||{});

    var tot=0,work=0,off=0,abs=0,empChips=[];
    for(var j=0;j<emps.length;j++){
      var emp=emps[j];
      var jd=emp.joinDate||"2026-04-01";
      if(ref<jd) continue;
      tot++;
      var eid=String(+emp.id);
      var hasOff=offs[eid]&&offs[eid][ref];
      var hasAbs=abss[eid]&&abss[eid][ref];
      if(hasOff){off++;empChips.push({n:emp.name,s:"off",a:""});}
      else if(hasAbs){
        abs++;
        var al=hasAbs==="교육"?"교":hasAbs==="출장"?"출":hasAbs==="병가"?"병":"기";
        empChips.push({n:emp.name,s:"abs",a:al,t:hasAbs});
      }else{work++;empChips.push({n:emp.name,s:"work",a:""});}
    }
    totAll+=tot;workAll+=work;offAll+=off;absAll+=abs;

    var chips=empChips.map(function(e){
      var cls=e.s==="work"?"chip-work":e.s==="off"?"chip-off":"chip-abs";
      var ic=e.s==="work"?"&#9679;":e.s==="off"?"&#xD734;":(e.a||"&#xBBF8;");
      return "<span class='emp-chip "+cls+"' title='"+(e.t||"")+"'><span>"+ic+"</span>"+e.n+"</span>";
    }).join("");

    cards.push(
      "<div class='site-card'>" +
        "<div class='site-hdr'>" +
          "<div class='site-name'>"+site.dispLabel+"</div>" +
          "<div class='site-total'>"+tot+"명</div>" +
        "</div>" +
        "<div class='site-gauge'>" +
          "<div class='sg-work' style='flex:"+work+"'></div>" +
          "<div class='sg-off'  style='flex:"+off +"'></div>" +
          "<div class='sg-abs'  style='flex:"+abs +"'></div>" +
        "</div>" +
        "<div class='stat-nums'>" +
          "<div class='stat-num sn-work'><div class='stat-num-lbl'>근&nbsp;무</div><div class='stat-num-val'>"+work+"</div></div>" +
          "<div class='stat-num sn-off'> <div class='stat-num-lbl'>휴&nbsp;무</div><div class='stat-num-val'>"+off +"</div></div>" +
          "<div class='stat-num sn-abs'> <div class='stat-num-lbl'>미근무</div><div class='stat-num-val'>"+abs +"</div></div>" +
        "</div>" +
        "<div class='emp-list'>"+chips+"</div>" +
      "</div>"
    );
  }

  grid.innerHTML=cards.join("");
  document.getElementById("vTot").textContent=totAll;
  document.getElementById("vWork").textContent=workAll;
  document.getElementById("vOff").textContent=offAll;
  document.getElementById("vAbs").textContent=absAll;
  document.getElementById("gWork").style.flex=workAll||0;
  document.getElementById("gOff").style.flex=offAll||0;
  document.getElementById("gAbs").style.flex=absAll||0;

  var dn=data.dashNotice||{};
  var today2=ref;
  var noticeTxt="";
  if(dn.items && Array.isArray(dn.items)){
    var activeItems=[];
    for(var ni=0;ni<dn.items.length;ni++){
      var item=dn.items[ni];
      if(item.text && item.startDate && item.endDate){
        if(today2>=item.startDate && today2<=item.endDate){
          activeItems.push(item.text.trim());
        }
      }
    }
    noticeTxt=activeItems.join("          ");
  } else {
    noticeTxt=typeof dn==="object"?(dn[ym]||""):dn;
  }
  var bar=document.getElementById("noticeBar");
  var span=document.getElementById("noticeText");
  if(noticeTxt&&noticeTxt.trim()){
    span.textContent=noticeTxt.trim();
    bar.style.display="flex";
    var dur=Math.max(18,noticeTxt.length*0.22);
    span.style.animation="none";
    span.style.animation="marquee "+dur+"s linear infinite";
  }else{bar.style.display="none";}

  var now=new Date();
  document.getElementById("ftTime").textContent=
    pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds())+" 갱신";
  document.getElementById("syncLbl").textContent="실시간 동기화 중";

  var ld=document.getElementById("ld");
  if(ld) ld.className="loading hide";
}

function loadData(){
  var url=DB+".json";
  var xhr=new XMLHttpRequest();
  xhr.open("GET",url,true);
  xhr.timeout=10000;
  xhr.onreadystatechange=function(){
    if(xhr.readyState===4){
      if(xhr.status===200){
        try{
          var data=JSON.parse(xhr.responseText);
          render(data);
        }catch(e){
          document.getElementById("ldtxt").textContent="데이터 파싱 오류: "+e.message;
        }
      }else{
        document.getElementById("syncLbl").textContent="로드 실패 ("+xhr.status+") 재시도 중...";
      }
    }
  };
  xhr.onerror=function(){document.getElementById("syncLbl").textContent="네트워크 오류. 재시도 중...";}
  xhr.send();
}

// 글씨 크기
var _fontScale=100, _fontStep=5, _fontMin=70, _fontMax=200;
var _origStyle=null;

function initFontCtrl(){
  var styleEl=document.querySelector('style');
  if(styleEl&&!_origStyle) _origStyle=styleEl.textContent;
  try{
    var saved=localStorage.getItem('dash_font_scale_mobile');
    if(saved) _fontScale=+saved;
  }catch(e){}
  applyFontScale();
}
function adjFont(dir){
  if(dir===0){_fontScale=100;}
  else{_fontScale=Math.min(_fontMax,Math.max(_fontMin,_fontScale+dir*_fontStep));}
  applyFontScale();
  try{localStorage.setItem('dash_font_scale_mobile',_fontScale);}catch(e){}
}
function applyFontScale(){
  var lbl=document.getElementById('fontScaleLbl');
  if(lbl) lbl.textContent=_fontScale+'%';
  if(!_origStyle) return;
  var ratio=_fontScale/100;
  var newCss=_origStyle.replace(/font-size:([\d.]+)px/g,function(m,v){
    return 'font-size:'+Math.round(+v*ratio)+'px';
  });
  var styleEl=document.querySelector('style');
  if(styleEl) styleEl.textContent=newCss;
}

initDateInp();
initFontCtrl();
loadData();
setInterval(loadData,30000);

// 자정 자동 새로고침
(function(){
  var now=new Date();
  var midnight=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
  setTimeout(function(){location.reload();},midnight-now+5000);
})();
</script>
