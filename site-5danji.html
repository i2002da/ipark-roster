<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPC 5단지 근무현황</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Roboto+Mono:wght@400;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100vh;overflow:hidden;background:#0a1628;color:#e8f4ff;font-family:'Noto Sans KR',sans-serif}
body{display:flex;flex-direction:column}
.hdr{height:68px;flex-shrink:0;background:linear-gradient(135deg,#0a2342,#0d2e56);border-bottom:3px solid #1a6fc4;display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.hdr-left{display:flex;align-items:center;gap:12px}
.hdr-badge{background:linear-gradient(135deg,#1a6fc4,#3d9bdc);color:#fff;font-size:11px;font-weight:900;padding:4px 11px;border-radius:6px;letter-spacing:1px;flex-shrink:0}
.hdr-site{font-size:20px;font-weight:900;color:#fff}
.hdr-full{font-size:10px;color:rgba(255,255,255,.4);margin-top:2px}
.hdr-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
.hdr-weekrange{font-size:11px;color:#60a5fa;font-family:'Roboto Mono',monospace;background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.2);padding:4px 10px;border-radius:5px;white-space:nowrap}
.hdr-clock{text-align:right;font-family:'Roboto Mono',monospace}
.hdr-date{font-size:15px;font-weight:700;color:#60a5fa}
.hdr-time{font-size:11px;color:rgba(255,255,255,.35);margin-top:1px}
.hdr-link{color:rgba(255,255,255,.45);font-size:10px;text-decoration:none;border:1px solid rgba(255,255,255,.15);border-radius:5px;padding:4px 8px;transition:all .15s;white-space:nowrap}
.hdr-link:hover{background:rgba(255,255,255,.1);color:#fff}
.stat-bar{flex-shrink:0;height:50px;background:#060f1e;border-bottom:1px solid #1e3550;display:flex;align-items:center;padding:0 24px;gap:0}
.stat-item{display:flex;align-items:center;gap:8px;padding:0 16px;border-right:1px solid #1e3550}
.stat-item:first-child{padding-left:0}
.stat-lbl{font-size:9px;color:rgba(255,255,255,.32);letter-spacing:.8px;font-weight:500}
.stat-val{font-size:22px;font-weight:900;font-family:'Roboto Mono',monospace;line-height:1}
.v-tot{color:#60a5fa}.v-work{color:#4ade80}.v-off{color:#f87171}.v-abs{color:#c084fc}
.stat-gauge{flex:1;display:flex;align-items:center;gap:8px;padding:0 16px}
.gauge-track{flex:1;height:9px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden;display:flex;gap:1px}
.gauge-work{background:#22c55e;transition:flex .6s}
.gauge-off{background:#ef4444;transition:flex .6s}
.gauge-abs{background:#a855f7;transition:flex .6s}
.gauge-legend{display:flex;gap:10px;flex-shrink:0}
.g-leg{display:flex;align-items:center;gap:4px;font-size:10px;color:rgba(255,255,255,.38)}
.g-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
/* 테이블 영역 */
.week-wrap{flex:1;overflow-y:auto;overflow-x:auto;padding:10px 24px 14px;min-height:0}
.week-wrap::-webkit-scrollbar{width:4px;height:4px}
.week-wrap::-webkit-scrollbar-thumb{background:#1e3550;border-radius:2px}
.week-table{width:100%;border-collapse:separate;border-spacing:0}
/* 헤더 */
.week-table thead th{position:sticky;top:0;z-index:3;background:#0a1e38;padding:7px 4px;text-align:center;font-weight:700;color:rgba(255,255,255,.65);border-bottom:2px solid #1e3550;white-space:nowrap}
.week-table thead th.th-name{text-align:left;padding-left:12px;min-width:80px;position:sticky;top:0;left:0;z-index:5;background:#0a1e38;border-right:1px solid #1e3550}
.week-table thead th.th-dept{min-width:56px;position:sticky;top:0;left:var(--nw,80px);z-index:5;background:#0a1e38;border-right:1px solid #1e3550}
.week-table thead th.th-tot{min-width:44px;background:#0a1628;border-right:1px solid #1e3550}
.week-table thead th.th-day{min-width:clamp(58px,7vw,100px)}
.week-table thead th.td-today-col{background:#0a2a4a!important;color:#60a5fa}
.week-table thead th.td-sat-col{color:#7ac8f0}
.week-table thead th.td-sun-col,.week-table thead th.td-hol-col{background:rgba(120,20,20,.4)!important;color:#f87171}
.day-num{font-size:clamp(15px,1.6vw,22px);font-weight:900;display:block;font-family:'Roboto Mono',monospace;line-height:1}
.day-wd{font-size:clamp(9px,0.85vw,12px);opacity:.55;margin-top:2px}
.day-hol-name{font-size:9px;opacity:.65;margin-top:1px;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 직원 행 */
.week-table tbody tr:hover td{background:rgba(255,255,255,.04)!important}
.week-table tbody tr.tr-pre{opacity:.35}
.week-table tbody td{padding:6px 4px;text-align:center;border-bottom:1px solid rgba(255,255,255,.05);background:#0a1628;vertical-align:middle}
.week-table tbody td.td-name{text-align:left;padding-left:12px;position:sticky;left:0;z-index:2;background:#0a1628;box-shadow:2px 0 6px rgba(0,0,0,.3);border-right:1px solid rgba(255,255,255,.06)}
.week-table tbody td.td-dept{position:sticky;left:var(--nw,80px);z-index:2;background:#0a1628;border-right:1px solid rgba(255,255,255,.06)}
.week-table tbody td.td-tot{border-right:1px solid rgba(255,255,255,.06);font-family:'Roboto Mono',monospace;font-weight:700;font-size:clamp(12px,1.1vw,16px);color:#60a5fa}
.week-table tbody tr:hover td.td-name,
.week-table tbody tr:hover td.td-dept,
.week-table tbody tr:hover td.td-tot{background:#0f1e30!important}
.emp-name-txt{font-size:clamp(12px,1.2vw,17px);font-weight:700;color:#fff;white-space:nowrap}
.emp-dept-bdg{display:inline-block;padding:2px 6px;border-radius:4px;font-size:clamp(9px,0.8vw,11px);font-weight:600;background:rgba(96,165,250,.12);color:#7ac8f0;white-space:nowrap}
/* 날짜 셀 배경 */
.week-table tbody td.td-day{}
.week-table tbody td.td-today-col{background:rgba(96,165,250,.06)!important}
.week-table tbody td.td-sat-col{background:rgba(100,180,255,.03)}
.week-table tbody td.td-sun-col,.week-table tbody td.td-hol-col{background:rgba(239,68,68,.04)}
/* 상태 칩 */
.day-chip{display:inline-flex;align-items:center;justify-content:center;width:clamp(30px,3.2vw,54px);height:clamp(24px,2.6vh,36px);border-radius:6px;font-weight:700;font-size:clamp(10px,1vw,15px)}
.chip-work{background:rgba(34,197,94,.14);color:#4ade80}
.chip-off{background:rgba(239,68,68,.18);color:#f87171}
.chip-abs{background:rgba(168,85,247,.15);color:#c084fc;font-size:clamp(9px,0.85vw,12px)}
.chip-pre{background:rgba(255,255,255,.04);color:#2d4060}
.chip-sat{background:rgba(100,180,255,.09);color:#5aafef}
.chip-sun{background:rgba(239,68,68,.08);color:#e06060}
.chip-hol{background:rgba(239,68,68,.08);color:#e06060}
/* 하단 */
.footer{flex-shrink:0;height:34px;background:#060e1a;border-top:1px solid #1e3550;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:10px}
.footer-l{color:rgba(255,255,255,.25);display:flex;align-items:center;gap:6px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.footer-r{font-family:'Roboto Mono',monospace;color:rgba(255,255,255,.18);font-size:10px}
.loading{position:fixed;inset:0;background:#0a1628;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:99;transition:opacity .5s}
.loading.out{opacity:0;pointer-events:none}
.spin{width:40px;height:40px;border:3px solid #1e3550;border-top-color:#1a6fc4;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{color:rgba(255,255,255,.32);font-size:12px}
</style>
</head>
<body>
<div class="loading" id="ld"><div class="spin"></div><div class="load-txt" id="ldtxt">연결 중...</div></div>

<div class="hdr">
  <div class="hdr-left">
    <div class="hdr-badge">IPC</div>
    <div><div class="hdr-site" id="siteName">-</div><div class="hdr-full" id="siteFull">-</div></div>
  </div>
  <div class="hdr-right">
    <div class="hdr-weekrange" id="weekRange">-</div>
    <a class="hdr-link" href="https://i2002da.github.io/ipark-roster/dashboard.html" target="_blank">📺 전체현황</a>
    <a class="hdr-link" id="linkRoster" href="https://i2002da.github.io/ipark-roster/" target="_blank">📋 계획표</a>
    <div class="hdr-clock">
      <div class="hdr-date" id="hdrDate">-</div>
      <div class="hdr-time" id="hdrTime">-</div>
    </div>
  </div>
</div>

<div class="stat-bar">
  <div class="stat-item"><div><div class="stat-lbl">총원</div><div class="stat-val v-tot" id="vTot">-</div></div></div>
  <div class="stat-item"><div><div class="stat-lbl">오늘 근무</div><div class="stat-val v-work" id="vWork">-</div></div></div>
  <div class="stat-item"><div><div class="stat-lbl">오늘 휴무</div><div class="stat-val v-off" id="vOff">-</div></div></div>
  <div class="stat-item"><div><div class="stat-lbl">현장미근무</div><div class="stat-val v-abs" id="vAbs">-</div></div></div>
  <div class="stat-gauge">
    <div class="gauge-track">
      <div class="gauge-work" id="gWork" style="flex:0"></div>
      <div class="gauge-off"  id="gOff"  style="flex:0"></div>
      <div class="gauge-abs"  id="gAbs"  style="flex:0"></div>
    </div>
    <div class="gauge-legend">
      <div class="g-leg"><div class="g-dot" style="background:#22c55e"></div>근무</div>
      <div class="g-leg"><div class="g-dot" style="background:#ef4444"></div>휴무</div>
      <div class="g-leg"><div class="g-dot" style="background:#a855f7"></div>미근무</div>
    </div>
  </div>
</div>

<div class="week-wrap">
  <table class="week-table" id="weekTable">
    <thead id="weekHead"></thead>
    <tbody id="weekBody"></tbody>
  </table>
</div>

<div class="footer">
  <div class="footer-l"><div class="sync-dot"></div>실시간 Firebase 연동 · 주간 근무계획</div>
  <div class="footer-r" id="ftTime">-</div>
</div>

<script>
const FB={apiKey:"AIzaSyB57PgBcbvN58iar6ZEvRMXOc_xSagQR68",authDomain:"workingday-efcd6.firebaseapp.com",databaseURL:"https://workingday-efcd6-default-rtdb.firebaseio.com",projectId:"workingday-efcd6",storageBucket:"workingday-efcd6.firebasestorage.app",messagingSenderId:"665757328084",appId:"1:665757328084:web:95a745423e01082c3ad141"};
const DB_PATH='hdr_v1';
const SITE_ID='site_1777681976623';
const WD=['일','월','화','수','목','금','토'];
let _hols={};

function pad(n){return String(n).padStart(2,'0')}
function toKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function toArr(v){if(!v)return[];if(Array.isArray(v))return v;return Object.keys(v).sort((a,b)=>+a-+b).map(k=>v[k]);}

// 이번 주 월~일
function getWeek(){
  const t=new Date(),m=new Date(t);
  m.setDate(t.getDate()-t.getDay()+1);
  return Array.from({length:7},(_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return d;});
}
function dayType(d){
  const k=toKey(d),w=d.getDay();
  if(_hols[k]) return 'hol';
  if(w===0) return 'sun';
  if(w===6) return 'sat';
  return 'work';
}

// 시계
function tick(){
  const d=new Date();
  document.getElementById('hdrDate').textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+WD[d.getDay()]+')';
  document.getElementById('hdrTime').textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
}
setInterval(tick,1000);tick();

function render(data){
  _hols=data.holidays||{};
  const sites=Array.isArray(data.sites)?data.sites:toArr(data.sites);
  const site=SITE_ID?sites.find(s=>s.id===SITE_ID||s.label===SITE_ID):sites[0];
  if(!site){document.getElementById('ldtxt').textContent='현장을 찾을 수 없습니다';return;}
  const sid=site.id;
  document.getElementById('siteName').textContent=site.dispLabel;
  document.getElementById('siteFull').textContent=site.fullName||'';
  document.getElementById('linkRoster').href='https://i2002da.github.io/ipark-roster/?site='+sid;

  const today=new Date(),todayKey=toKey(today);
  const week=getWeek();

  // 주간 범위
  const w0=week[0],w6=week[6];
  document.getElementById('weekRange').textContent=
    (w0.getMonth()+1)+'월'+w0.getDate()+'일~'+(w6.getMonth()+1)+'월'+w6.getDate()+'일';

  // 직원 목록 (목요일 기준 월)
  const refYm=String(week[3].getFullYear())+pad(week[3].getMonth()+1);
  const snaps=(data.empSnaps&&data.empSnaps[sid])||{};
  const emps=snaps[refYm]?toArr(snaps[refYm]):toArr((data.employees||{})[sid]);
  const offs=((data.offDays||{})[sid])||{};
  const abss=((data.absDays||{})[sid])||{};

  // 오늘 집계
  let tot=0,work=0,off=0,abs=0;
  emps.forEach(emp=>{
    const jd=emp.joinDate||'2026-04-01';
    if(todayKey<jd) return;
    tot++;
    const eid=String(+emp.id);
    if(offs[eid]&&offs[eid][todayKey]) off++;
    else if(abss[eid]&&abss[eid][todayKey]) abs++;
    else work++;
  });
  document.getElementById('vTot').textContent=tot;
  document.getElementById('vWork').textContent=work;
  document.getElementById('vOff').textContent=off;
  document.getElementById('vAbs').textContent=abs;
  document.getElementById('gWork').style.flex=work||0;
  document.getElementById('gOff').style.flex=off||0;
  document.getElementById('gAbs').style.flex=abs||0;

  // 이름 열 너비 동적 계산
  const nw=Math.min(Math.max(80,window.innerWidth*0.09),130);
  const dw=Math.min(Math.max(50,window.innerWidth*0.055),80);
  document.documentElement.style.setProperty('--nw',nw+'px');

  // 헤더
  const headCols=week.map(d=>{
    const dt=dayType(d),k=toKey(d),isT=k===todayKey;
    const cls=isT?'td-today-col':dt==='sat'?'td-sat-col':dt==='sun'||dt==='hol'?'td-sun-col':'';
    const hn=(_hols[k]||'').slice(0,5);
    return `<th class="th-day ${cls}">
      <span class="day-num">${d.getDate()}</span>
      <div class="day-wd">${WD[d.getDay()]}</div>
      ${hn?`<div class="day-hol-name">${hn}</div>`:''}
    </th>`;
  }).join('');

  document.getElementById('weekHead').innerHTML=`<tr>
    <th class="th-name" style="min-width:${nw}px;left:0">성명</th>
    <th class="th-dept" style="min-width:${dw}px;left:${nw}px">구분</th>
    <th class="th-tot">휴<br>무계</th>
    ${headCols}
  </tr>`;

  // 직원 행 (오늘 기준 정렬)
  const sorted=emps.map(emp=>{
    const eid=String(+emp.id),jd=emp.joinDate||'2026-04-01';
    const pre=todayKey<jd;
    const o=!pre&&offs[eid]&&offs[eid][todayKey];
    const a=!pre&&abss[eid]&&abss[eid][todayKey];
    return {emp,eid,jd,ord:pre?3:o?1:a?2:0};
  }).sort((a,b)=>a.ord-b.ord);

  const rows=sorted.map(({emp,eid,jd,ord})=>{
    const pre=ord===3;
    // 주간 휴무계
    const ym1=String(week[0].getFullYear())+pad(week[0].getMonth()+1);
    const ym2=String(week[6].getFullYear())+pad(week[6].getMonth()+1);
    const eoOff=offs[eid]||{};
    const weekOff=week.filter(d=>{
      const k=toKey(d),dt=dayType(d);
      return k>=jd && eoOff[k] && dt==='work';
    }).length;

    const cells=week.map(d=>{
      const k=toKey(d),dt=dayType(d),isT=k===todayKey;
      const colCls=isT?'td-today-col':dt==='sat'?'td-sat-col':dt==='sun'||dt==='hol'?'td-sun-col':'';
      let cc='',ct='';
      if(k<jd){cc='chip-pre';ct='—';}
      else{
        const hasOff=offs[eid]&&offs[eid][k];
        const hasAbs=abss[eid]&&abss[eid][k];
        if(hasOff){cc='chip-off';ct='휴';}
        else if(hasAbs){cc='chip-abs';ct=(hasAbs||'미').charAt(0);}
        else if(dt==='sat'){cc='chip-sat';ct='토';}
        else if(dt==='sun'){cc='chip-sun';ct='일';}
        else if(dt==='hol'){cc='chip-hol';ct='공';}
        else{cc='chip-work';ct='●';}
      }
      return `<td class="td-day ${colCls}"><span class="day-chip ${cc}">${ct}</span></td>`;
    }).join('');

    return `<tr class="${pre?'tr-pre':''}">
      <td class="td-name" style="left:0"><span class="emp-name-txt">${emp.name}</span></td>
      <td class="td-dept" style="left:${nw}px">${emp.dept?`<span class="emp-dept-bdg">${emp.dept}</span>`:''}</td>
      <td class="td-tot">${pre?'':weekOff||''}</td>
      ${cells}
    </tr>`;
  }).join('');

  document.getElementById('weekBody').innerHTML=rows;

  // 갱신 시각
  document.getElementById('ftTime').textContent=
    pad(today.getHours())+':'+pad(today.getMinutes())+':'+pad(today.getSeconds())+' 갱신';

  const ld=document.getElementById('ld');
  if(ld&&!ld.classList.contains('out')){ld.classList.add('out');setTimeout(()=>ld.remove(),600);}
}

(async()=>{
  for(let i=0;i<50;i++){if(window.firebase&&window.firebase.database)break;await new Promise(r=>setTimeout(r,100));}
  try{
    if(!firebase.apps.length) firebase.initializeApp(FB);
    firebase.database().ref(DB_PATH).on('value',snap=>{if(snap.val())render(snap.val());});
  }catch(e){document.getElementById('ldtxt').textContent='연결 실패:'+e.message;}
})();

// 자정 자동 새로고침
setTimeout(()=>location.reload(), new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()+1)-new Date()+5000);
</script>
</body>
</html>
