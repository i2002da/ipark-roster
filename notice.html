<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPC 통합현장 공지사항 관리</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#f0f4f8;min-height:100vh}
.hdr{background:linear-gradient(135deg,#0a2342,#1a3a5c);padding:0 28px;height:66px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 16px rgba(10,35,66,.2);position:sticky;top:0;z-index:10}
.hdr-left{display:flex;align-items:center;gap:14px}
.hdr-badge{background:#1a6fc4;color:#fff;font-size:12px;font-weight:900;padding:5px 12px;border-radius:7px;letter-spacing:1px}
.hdr-title{font-size:18px;font-weight:900;color:#fff}
.hdr-sub{font-size:11px;color:rgba(255,255,255,.5);margin-top:2px}
.hdr-right{display:flex;gap:10px;align-items:center}
.hdr-link{color:rgba(255,255,255,.6);font-size:11px;text-decoration:none;border:1px solid rgba(255,255,255,.2);border-radius:5px;padding:5px 10px;transition:all .15s}
.hdr-link:hover{background:rgba(255,255,255,.12);color:#fff}
.preview-bar{background:#0a2342;border-bottom:2px solid #1a6fc4;padding:0;height:72px;display:flex;align-items:center;overflow:hidden}
.preview-prefix{flex-shrink:0;padding:0 20px;font-size:18px;font-weight:700;color:#60a5fa;background:#060e1e;height:100%;display:flex;align-items:center;border-right:1px solid #1e3550;white-space:nowrap}
.preview-track{flex:1;overflow:hidden;position:relative;height:100%;display:flex;align-items:center}
.preview-text{display:inline-block;white-space:nowrap;font-size:26px;color:rgba(255,255,255,.9);font-weight:600;position:absolute;padding-left:100%;animation:marquee 30s linear infinite}
.preview-empty{color:rgba(255,255,255,.2);font-size:14px;padding-left:20px}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
.content{max-width:860px;margin:0 auto;padding:28px 20px 60px}
.section{background:#fff;border-radius:14px;border:1px solid #c2d4e8;margin-bottom:20px;overflow:hidden;box-shadow:0 2px 12px rgba(10,35,66,.07)}
.sec-hdr{background:#f8faff;border-bottom:1px solid #dde8f2;padding:14px 22px;display:flex;align-items:center;gap:10px}
.sec-title{font-size:14px;font-weight:700;color:#0a2342}
.sec-badge{background:#ddeeff;color:#0a2342;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;letter-spacing:.3px}
.sec-body{padding:18px 22px;display:flex;flex-direction:column;gap:12px}
.field-lbl{font-size:12px;font-weight:700;color:#3d6b9a;margin-bottom:4px}
.month-sel{display:flex;align-items:center;gap:8px;background:#f0f4f8;border:1px solid #c2d4e8;border-radius:8px;padding:8px 14px;width:fit-content}
.month-sel select{background:transparent;border:none;outline:none;font-size:14px;font-weight:600;color:#0a2342;font-family:'Noto Sans KR',sans-serif;cursor:pointer}
.notice-inp{width:100%;padding:12px 14px;background:#f8faff;border:1px solid #c2d4e8;border-radius:8px;font-size:14px;color:#0a2342;font-family:'Noto Sans KR',sans-serif;resize:vertical;min-height:90px;outline:none;transition:border-color .15s}
.notice-inp:focus{border-color:#1a6fc4;background:#fff}
.notice-inp::placeholder{color:#aab8cc}
.row-actions{display:flex;align-items:center;justify-content:space-between}
.char-count{font-size:11px;color:#7a9bbf}
.btn-save{background:linear-gradient(135deg,#0a2342,#1a6fc4);color:#fff;border:none;border-radius:8px;padding:9px 22px;font-size:13px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;transition:opacity .15s;display:flex;align-items:center;gap:6px}
.btn-save:hover{opacity:.88}
.btn-save:disabled{opacity:.5;cursor:default}
.btn-clear{background:transparent;color:#c0392b;border:1px solid #c0392b;border-radius:7px;padding:7px 14px;font-size:12px;font-weight:600;font-family:'Noto Sans KR',sans-serif;cursor:pointer;transition:all .15s}
.btn-clear:hover{background:#fff0f0}
.toast{display:none;align-items:center;gap:8px;background:#d4edda;border:1px solid #86c99a;color:#1a5c30;padding:8px 14px;border-radius:7px;font-size:12px;font-weight:600}
.toast.show{display:flex}
.toast.err{background:#ffd5d5;border-color:#c0392b;color:#8b1a1a}
.guide{background:#f0f7ff;border:1px solid #c0d8f0;border-radius:10px;padding:14px 18px;margin-bottom:20px}
.guide-title{font-size:12px;font-weight:700;color:#0a2342;margin-bottom:6px}
.guide ul{padding-left:16px;font-size:12px;color:#3d6b9a;line-height:2}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-left">
    <div class="hdr-badge">IPC</div>
    <div>
      <div class="hdr-title">&#128226; 통합현장 공지사항 관리</div>
      <div class="hdr-sub">대시보드 하단 마퀴 공지 입력</div>
    </div>
  </div>
  <div class="hdr-right">
    <a class="hdr-link" href="https://i2002da.github.io/ipark-roster/dashboard.html" target="_blank">&#128250; 대시보드</a>
    <a class="hdr-link" href="https://i2002da.github.io/ipark-roster/" target="_blank">&#128203; 휴무계획표</a>
  </div>
</div>

<div class="preview-bar">
  <div class="preview-prefix">&#128226; 공지</div>
  <div class="preview-track">
    <span class="preview-text" id="previewText" style="display:none"></span>
    <span class="preview-empty" id="previewEmpty">공지사항을 입력하면 여기에 미리보기가 표시됩니다</span>
  </div>
</div>

<div class="content">
  <div class="guide">
    <div class="guide-title">&#128161; 사용 안내</div>
    <ul>
      <li>각 현장별로 공지사항을 입력하면 <b>대시보드 하단</b>에 흐르는 자막으로 표시됩니다</li>
      <li>공지가 없는 현장은 대시보드에서 자동으로 제외됩니다</li>
      <li>저장 즉시 Firebase에 동기화되어 대시보드에 실시간 반영됩니다</li>
      <li>내용을 비우고 저장하면 해당 월 공지가 제거됩니다</li>
    </ul>
  </div>

  <div class="section">
    <div class="sec-hdr"><span class="sec-title">&#128197; 기준 월 선택</span></div>
    <div class="sec-body" style="flex-direction:row;align-items:center;gap:16px">
      <div class="month-sel">
        <span style="font-size:13px;color:#3d6b9a;font-weight:600">기준 월:</span>
        <select id="selYear"></select>년
        <select id="selMonth"></select>월
      </div>
      <span style="font-size:12px;color:#7a9bbf">선택한 달의 공지사항을 관리합니다</span>
    </div>
  </div>

  <div id="siteForms"></div>
</div>

<script>
const FB={apiKey:"AIzaSyB57PgBcbvN58iar6ZEvRMXOc_xSagQR68",authDomain:"workingday-efcd6.firebaseapp.com",databaseURL:"https://workingday-efcd6-default-rtdb.firebaseio.com",projectId:"workingday-efcd6",storageBucket:"workingday-efcd6.firebasestorage.app",messagingSenderId:"665757328084",appId:"1:665757328084:web:95a745423e01082c3ad141"};
const DB_PATH='hdr_v1';
let _db=null,_sites=[],_notices={};

function pad(n){return String(n).padStart(2,'0')}
function getYm(){return String(+document.getElementById('selYear').value)+pad(+document.getElementById('selMonth').value)}

function initMonthSel(){
  const today=new Date(),sy=document.getElementById('selYear'),sm=document.getElementById('selMonth');
  for(let y=2026;y<=2028;y++){const o=document.createElement('option');o.value=y;o.textContent=y;if(y===today.getFullYear())o.selected=true;sy.appendChild(o);}
  for(let m=1;m<=12;m++){const o=document.createElement('option');o.value=m;o.textContent=pad(m);if(m===today.getMonth()+1)o.selected=true;sm.appendChild(o);}
  sy.addEventListener('change',()=>{renderForms();updatePreview();});
  sm.addEventListener('change',()=>{renderForms();updatePreview();});
}

function renderForms(){
  const ym=getYm();
  document.getElementById('siteForms').innerHTML=_sites.map(site=>{
    const sid=site.id,nd=_notices[sid]||{};
    const current=typeof nd==='object'?(nd[ym]||''):nd;
    return `<div class="section" id="sec_${sid}">
      <div class="sec-hdr">
        <span class="sec-title">${site.dispLabel}</span>
        <span class="sec-badge">${site.fullName||''}</span>
        <div id="toast_${sid}" class="toast" style="margin-left:auto"></div>
      </div>
      <div class="sec-body">
        <div>
          <div class="field-lbl">공지사항 내용 <span style="color:#7a9bbf;font-weight:400">(비우면 대시보드에서 제거)</span></div>
          <textarea class="notice-inp" id="ta_${sid}" placeholder="${site.dispLabel} 현장 공지사항을 입력하세요..." oninput="onInput('${sid}')">${current}</textarea>
        </div>
        <div class="row-actions">
          <span class="char-count" id="cc_${sid}">${current.length}자</span>
          <div style="display:flex;gap:8px">
            <button class="btn-clear" onclick="clearNotice('${sid}')">&#128465; 삭제</button>
            <button class="btn-save" id="btn_${sid}" onclick="saveNotice('${sid}')">&#128190; 저장</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function updatePreview(){
  const ym=getYm(),texts=[];
  _sites.forEach(s=>{
    const ta=document.getElementById('ta_'+s.id);
    const v=ta?ta.value.trim():(typeof(_notices[s.id])==='object'?(_notices[s.id][ym]||''):(_notices[s.id]||''));
    if(v) texts.push('['+s.dispLabel+'] '+v);
  });
  const span=document.getElementById('previewText'),empty=document.getElementById('previewEmpty');
  if(!texts.length){span.style.display='none';empty.style.display='';}
  else{
    const c=texts.join('          ');
    span.textContent=c;span.style.display='';empty.style.display='none';
    const dur=Math.max(20,c.length*0.25);
    span.style.animation='none';void span.offsetWidth;span.style.animation='marquee '+dur+'s linear infinite';
  }
}

function onInput(sid){const ta=document.getElementById('ta_'+sid),cc=document.getElementById('cc_'+sid);if(cc)cc.textContent=ta.value.length+'자';updatePreview();}

async function saveNotice(sid){
  const ta=document.getElementById('ta_'+sid),btn=document.getElementById('btn_'+sid),toast=document.getElementById('toast_'+sid);
  const val=ta.value.trim(),ym=getYm();
  btn.disabled=true;btn.textContent='저장 중...';
  try{
    if(!_notices[sid]||typeof _notices[sid]==='string') _notices[sid]={};
    if(val) _notices[sid][ym]=val;
    else delete _notices[sid][ym];
    await _db.child('notices/'+sid).set(_notices[sid]);
    showToast(toast,'저장 완료',false);updatePreview();
  }catch(e){showToast(toast,'저장 실패: '+e.message,true);}
  btn.disabled=false;btn.textContent='저장';
}

async function clearNotice(sid){document.getElementById('ta_'+sid).value='';onInput(sid);await saveNotice(sid);}

function showToast(el,msg,err){el.textContent=msg;el.className='toast show'+(err?' err':'');setTimeout(()=>{el.className='toast';},3000);}

(async()=>{
  initMonthSel();
  for(let i=0;i<50;i++){if(window.firebase&&window.firebase.database)break;await new Promise(r=>setTimeout(r,100));}
  try{
    if(!firebase.apps.length) firebase.initializeApp(FB);
    _db=firebase.database().ref(DB_PATH);
    _db.on('value',snap=>{
      const data=snap.val();if(!data)return;
      _sites=Array.isArray(data.sites)?data.sites:Object.values(data.sites||{});
      _notices=data.notices||{};
      renderForms();updatePreview();
    });
  }catch(e){document.getElementById('siteForms').innerHTML='<div style="padding:20px;color:#c0392b">연결 실패: '+e.message+'</div>';}
})();
</script>
</body>
</html>
